; TEMPO (Timing, Engine, Mouse & Physics Overhaul) - keeps Fallout 3 running at the same speed
; regardless of framerate.
; Lives next to TEMPO.dll in Data\FOSE\Plugins. A log is written to TEMPO.log there.

[Timer]
; Replace the engine's frame timers (GetTickCount based, forced 10 ms minimum frame time with a
; Sleep = hidden jittery 100 FPS cap) with QueryPerformanceCounter timers. Covers every timer
; instance: world, interface/menus, etc.
bFixTimer=1
; Redirect the game's GetTickCount (15.6 ms resolution, the "64 Hz issue") to a 1 ms clock.
bFixGetTickCount=1
; Request 1 ms Windows timer resolution (makes every Sleep in the game precise).
bTimerResolution=1
; Frames longer than this are clamped (game slows down below ~6 FPS). Engine default: 166.
fMaxFrameTimeMs=166

[Limiter]
; Precise frame limiter. 0 = unlimited. A cap the game can hold steadily gives the most even
; frame pacing; with G-Sync/FreeSync keep it a few FPS under your refresh rate.
fFPSLimit=0

[Havok]
; Set the physics step (fMaxTime:HAVOK) to the real frame time every frame so physics runs one
; step per frame at the right speed. Overrides any fMaxTime in Fallout.ini.
bFixHavok=1
; Below this FPS the step stays at 1/fHavokMinFPS and Havok substeps instead.
fHavokMinFPS=30
; Above this FPS the step stays at 1/fHavokMaxFPS. Raise it if you run uncapped above 500 FPS.
fHavokMaxFPS=500

[Mouse]
; Disable Fallout 3's mouse acceleration so aiming is 1:1 with hand movement. Overrides the
; fForegroundMouse* settings in Fallout.ini (engine defaults Mult 4, Base 0.2, AccelTop 50,
; AccelBase 0.2 are all set to 0). Adjust overall speed with the in-game mouse sensitivity slider.
bDisableMouseAcceleration=1

[Debug]
; Log frame time statistics every 5 seconds to TEMPO.log.
bDebugStats=0
; Press this key in game to record every frame's timing to TEMPO_trace.csv for
; fTraceSeconds. Virtual-key code; 122 = F11, 145 = Scroll Lock, 45 = Insert. 0 = off.
iTraceKey=122
fTraceSeconds=20
